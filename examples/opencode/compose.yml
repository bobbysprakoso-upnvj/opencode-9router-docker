services:
  opencode-dev:
    build:
      context: .
      dockerfile: Dockerfile

    image: opencode-dev-local:latest
    container_name: opencode-dev

    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    working_dir: /workspace/docker

    stdin_open: true
    tty: true

    env_file:
      - .env

    environment:
      HOME: /home/opencode
      XDG_CONFIG_HOME: /home/opencode/.config
      XDG_DATA_HOME: /home/opencode/.local/share
      XDG_CACHE_HOME: /home/opencode/.cache
      XDG_STATE_HOME: /home/opencode/.local/state

    # IMPORTANT:
    # override image ENTRYPOINT "opencode"
    entrypoint:
      - /bin/sh
      - -c

    command:
      - sleep infinity

    volumes:
      - /home/bsp/docker:/workspace/docker
      - /home/bsp/Documents/Second-Brain:/knowledge/Second-Brain:ro

      - ./opencode.json:/home/opencode/.config/opencode/opencode.json:ro

      # GSD Hybrid v1 - selected skill surface
      - /home/bsp/docker/opencode-skills/community/gsd-core/hybrid-v1/skills:/home/opencode/.config/opencode/skills:ro

      # GSD pinned runtime
      - /home/bsp/docker/opencode-skills/community/gsd-core/1.12.0/gsd-core:/home/opencode/.config/opencode/gsd-core:ro
      - /home/bsp/docker/opencode-skills/community/gsd-core/1.12.0/hooks:/home/opencode/.config/opencode/hooks:ro
      - /home/bsp/docker/opencode-skills/community/gsd-core/1.12.0/plugins:/home/opencode/.config/opencode/plugins:ro
      - /home/bsp/docker/opencode-skills/community/gsd-core/1.12.0/scripts:/home/opencode/.config/opencode/scripts:ro

      # GSD policy defaults - model routing remains owned by 9Router
      - /home/bsp/docker/opencode-skills/community/gsd-core/config/defaults.json:/home/opencode/.gsd/defaults.json:ro

      - opencode-data:/home/opencode/.local/share/opencode
      - opencode-cache:/home/opencode/.cache/opencode
      - opencode-state:/home/opencode/.local/state

      # Superpowers pinned v6.3.0
      - /home/bsp/docker/opencode-skills/community/superpowers/6.3.0:/home/opencode/.config/opencode/superpowers:ro

    networks:
      - ai-network

    restart: "no"

volumes:
  opencode-data:
  opencode-cache:
  opencode-state:

networks:
  ai-network:
    external: true
